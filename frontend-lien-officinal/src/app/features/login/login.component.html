<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-green-700 text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        🏥
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Le Lien Officinal</h2>
      <p class="text-gray-500 text-sm">Connexion à votre espace pharmacie</p>
    </div>

    <form (submit)="onSubmit($event)" class="space-y-6">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email de l'officine</label>
        <input type="email" [(ngModel)]="email" name="email" required 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
               placeholder="pharmacie@exemple.fr">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" [(ngModel)]="password" name="password" required 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
               placeholder="••••••••">
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100 flex items-center gap-2">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
        <span *ngIf="isLoading" class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>

    </form>

    <div class="mt-4 text-center">
      <span class="text-sm text-gray-500">Pas encore de compte ? </span>
      <a routerLink="/onboarding" class="text-sm text-green-700 hover:text-green-800 font-medium">Créer mon compte</a>
    </div>

    <div class="mt-4 text-center text-xs text-gray-400">
      Accès réservé aux professionnels de santé.<br>
      Problème de connexion ? Contactez le support.
    </div>
  </div>
</div>
