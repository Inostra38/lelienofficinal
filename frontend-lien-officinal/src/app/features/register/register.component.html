<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">

    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-green-700 text-white rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        🏥
      </div>
      <h2 class="text-2xl font-bold text-gray-800">Créer mon compte</h2>
      <p class="text-gray-500 text-sm">Rejoignez Le Lien Officinal</p>
    </div>

    <form (submit)="onSubmit($event)" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email de l'officine</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="pharmacie@exemple.fr"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Minimum 8 caractères"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
        <input
          type="password"
          [(ngModel)]="passwordConfirm"
          name="passwordConfirm"
          required
          placeholder="••••••••"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none transition-all"
          [class.border-red-400]="passwordMismatch"
          [class.focus:ring-red-300]="passwordMismatch"
          [class.border-gray-300]="!passwordMismatch"
          [class.focus:ring-green-500]="!passwordMismatch"
          [class.focus:border-green-500]="!passwordMismatch"
        />
        @if (passwordMismatch) {
          <p class="text-xs text-red-500 mt-1">Les mots de passe ne correspondent pas.</p>
        }
      </div>

      @if (errorMessage) {
        <div class="bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100">
          ⚠️ {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="!isValid || isLoading"
        class="w-full bg-green-700 hover:bg-green-800 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2"
      >
        @if (isLoading) {
          <span class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
          Création du compte...
        } @else {
          Créer mon compte
        }
      </button>

    </form>

    <div class="mt-5 text-center">
      <span class="text-sm text-gray-500">Déjà un compte ? </span>
      <a routerLink="/login" class="text-sm text-green-700 hover:text-green-800 font-medium">Se connecter</a>
    </div>

    <div class="mt-4 text-center text-xs text-gray-400">
      Accès réservé aux professionnels de santé.
    </div>

  </div>
</div>
