<!-- Overlay -->
<div class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"
     (click)="cancelled.emit()">

  <!-- Modale -->
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
      <div>
        <h2 class="text-base font-bold text-gray-800">Nouveau fil de discussion</h2>
        <p class="text-xs text-gray-400 mt-0.5">Choisissez un sujet et des participants</p>
      </div>
      <button (click)="cancelled.emit()"
              class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Corps -->
    <div class="px-6 py-5 space-y-5">

      <!-- Champ sujet -->
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
          Sujet <span class="text-red-400">*</span>
        </label>
        <input [(ngModel)]="subject"
               type="text"
               placeholder="Ex : Commande urgente Doliprane…"
               maxlength="200"
               class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-green-400 transition"
               [class.border-red-300]="subject.length === 0 && submitting" />
        <p class="text-right text-[11px] text-gray-300 mt-1">{{ subject.length }}/200</p>
      </div>

      <!-- Sélection des participants -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
            Participants <span class="text-red-400">*</span>
          </label>
          <div class="flex gap-2">
            <button (click)="selectAll()"
                    [disabled]="allSelected"
                    class="text-[11px] text-green-600 hover:text-green-800 font-medium disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              Tous
            </button>
            <span class="text-gray-200">·</span>
            <button (click)="deselectAll()"
                    [disabled]="selectedIds.size === 0"
                    class="text-[11px] text-gray-400 hover:text-gray-600 font-medium disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              Aucun
            </button>
          </div>
        </div>

        <!-- Aucun membre -->
        <div *ngIf="selectableMembers.length === 0"
             class="text-center py-6 text-sm text-gray-300">
          Aucun autre membre dans l'équipe
        </div>

        <!-- Grille de membres -->
        <div class="space-y-2 max-h-52 overflow-y-auto pr-1">
          <button *ngFor="let member of selectableMembers"
                  (click)="toggleMember(member.id!)"
                  class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border transition-all"
                  [ngClass]="isSelected(member.id!)
                    ? 'bg-green-50 border-green-300'
                    : 'bg-white border-gray-100 hover:border-gray-200 hover:bg-gray-50'">

            <!-- Avatar -->
            <div class="w-8 h-8 rounded-full text-white flex items-center justify-center text-xs font-bold shrink-0"
                 [ngClass]="getBgClass(member.color)">
              {{ getInitials(member) }}
            </div>

            <!-- Nom + rôle -->
            <div class="flex-1 text-left min-w-0">
              <p class="text-sm font-medium text-gray-800 truncate">
                {{ member.first_name }} {{ member.last_name }}
              </p>
              <p class="text-xs text-gray-400 truncate">{{ member.role }}</p>
            </div>

            <!-- Checkbox visuelle -->
            <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 transition-colors"
                 [ngClass]="isSelected(member.id!)
                   ? 'bg-green-600 border-green-600'
                   : 'border-gray-300'">
              <svg *ngIf="isSelected(member.id!)" xmlns="http://www.w3.org/2000/svg"
                   class="h-3 w-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
          </button>
        </div>

        <!-- Compteur -->
        <p class="text-[11px] text-gray-400 mt-2">
          {{ selectedIds.size }} participant{{ selectedIds.size > 1 ? 's' : '' }} sélectionné{{ selectedIds.size > 1 ? 's' : '' }}
          <span class="text-gray-300">(+ vous)</span>
        </p>
      </div>

      <!-- Erreur -->
      <div *ngIf="error" class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-xs px-3 py-2.5 rounded-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        {{ error }}
      </div>

    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-50 flex items-center justify-end gap-3">
      <button (click)="cancelled.emit()"
              class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-gray-50 rounded-xl transition-colors">
        Annuler
      </button>
      <button (click)="submit()"
              [disabled]="!isValid || submitting"
              class="flex items-center gap-2 px-5 py-2 text-sm font-semibold rounded-xl transition-colors"
              [ngClass]="isValid && !submitting
                ? 'bg-green-700 hover:bg-green-800 text-white'
                : 'bg-gray-100 text-gray-300 cursor-not-allowed'">
        <div *ngIf="submitting" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
        <svg *ngIf="!submitting" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
        </svg>
        {{ submitting ? 'Création…' : 'Créer le fil' }}
      </button>
    </div>

  </div>
</div>
