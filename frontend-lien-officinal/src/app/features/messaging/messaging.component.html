<div class="flex h-full bg-gray-50 overflow-hidden relative">

  <!-- ── Sélecteur de collaborateur (overlay) ── -->
  <div *ngIf="showCollaboratorPicker"
       class="absolute inset-0 z-50 bg-white/80 backdrop-blur-sm flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 p-8 w-full max-w-sm mx-4">
      <h2 class="text-lg font-bold text-gray-800 mb-1">Messagerie d'équipe</h2>
      <p class="text-sm text-gray-400 mb-6">Qui êtes-vous pour cette session ?</p>

      <div class="grid grid-cols-3 gap-3">
        <button *ngFor="let collab of team"
                (click)="selectCollaborator(collab)"
                class="flex flex-col items-center gap-2 p-3 rounded-xl border border-gray-100 hover:border-green-300 hover:bg-green-50 transition-all group">
          <div class="w-10 h-10 rounded-full text-white flex items-center justify-center font-bold text-sm"
               [style.background-color]="collab.color">
            {{ getInitials(collab) }}
          </div>
          <span class="text-xs text-gray-600 font-medium text-center leading-tight">
            {{ collab.first_name }}
          </span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Layout principal ── -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- Colonne gauche : liste des conversations (30%) -->
    <div class="w-80 shrink-0 bg-white border-r border-gray-100 flex flex-col overflow-hidden">

      <!-- Collaborateur actif -->
      <div *ngIf="activeCollaborator"
           class="px-4 py-2.5 border-b border-gray-50 flex items-center gap-2.5 bg-green-50/60">
        <button (click)="changeCollaborator()"
                class="w-7 h-7 flex items-center justify-center rounded-lg text-gray-400 hover:text-red-600 hover:bg-red-50 transition-colors shrink-0"
                title="Fermer la session">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
        <div class="w-7 h-7 rounded-full text-white flex items-center justify-center text-xs font-bold shrink-0"
             [style.background-color]="activeCollaborator.color">
          {{ getInitials(activeCollaborator) }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-gray-700 truncate">
            {{ activeCollaborator.first_name }} {{ activeCollaborator.last_name }}
          </p>
          <p class="text-[10px] text-green-600 font-medium flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> En ligne
          </p>
        </div>
      </div>

      <!-- Liste des fils -->
      <app-conversation-list
        class="flex-1 overflow-hidden flex flex-col"
        [conversations]="conversations"
        [selectedId]="selectedConversation?.id ?? null"
        [loading]="loadingConversations"
        [activeCollaboratorId]="activeCollaborator?.id ?? null"
        (selected)="onConversationSelected($event)"
        (newConversation)="onNewConversation()"
        (deleteRequested)="onDeleteConversation($event)"
        (hideRequested)="onHideConversation($event)">
      </app-conversation-list>
    </div>

    <!-- Colonne droite : détail de la conversation (70%) -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- État vide -->
      <div *ngIf="!selectedConversation"
           class="flex-1 flex flex-col items-center justify-center text-center px-8">
        <div class="w-20 h-20 rounded-2xl bg-gray-50 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <h3 class="text-base font-semibold text-gray-400 mb-1">Aucune conversation sélectionnée</h3>
        <p class="text-sm text-gray-300">Sélectionnez une conversation ou créez-en une nouvelle</p>
        <button (click)="onNewConversation()"
                class="mt-5 flex items-center gap-2 bg-green-700 hover:bg-green-800 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          Nouveau fil
        </button>
      </div>

      <!-- Détail conversation -->
      <app-conversation-detail
        *ngIf="selectedConversation"
        class="flex-1 flex flex-col overflow-hidden"
        [conversation]="selectedConversation"
        [activeCollaboratorId]="activeCollaborator?.id ?? null"
        (deleted)="onConversationDeleted()">
      </app-conversation-detail>

    </div>
  </div>

  <!-- ── Dialog nouveau fil ── -->
  <app-new-conversation-dialog
    *ngIf="showNewConversationDialog"
    [teamMembers]="team"
    [activeCollaboratorId]="activeCollaborator?.id ?? null"
    (created)="onConversationCreated($event)"
    (cancelled)="showNewConversationDialog = false">
  </app-new-conversation-dialog>

  <!-- ── Modal PIN (switch) ── -->
  <app-pin-modal
    *ngIf="showPinModal && pendingCollaborator"
    [collaboratorId]="pendingCollaborator.id!"
    [collaboratorName]="pendingCollaborator.first_name + ' ' + pendingCollaborator.last_name"
    [collaboratorRole]="pendingCollaborator.role"
    mode="switch"
    (pinValidated)="onPinValidated()"
    (cancelled)="onPinCancelled()">
  </app-pin-modal>

</div>
