<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md animate-in fade-in slide-in-from-bottom-4 duration-200">

    <!-- En-tête -->
    <div class="px-6 py-4 border-b border-gray-100 bg-gradient-to-r from-green-50 to-green-100 rounded-t-xl flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-lg">{{ mode === 'assigned' ? '📤' : '📋' }}</span>
        <h3 class="text-base font-bold text-gray-800">
          {{ mode === 'assigned' ? 'Assigner une tâche' : 'Nouvelle tâche propre' }}
        </h3>
      </div>
      <button (click)="cancelled.emit()"
              class="p-1 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="p-6 space-y-4">

      <!-- Assigner à (mode assigned uniquement) -->
      <div *ngIf="mode === 'assigned'">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Assigner à <span class="text-red-500">*</span>
        </label>
        <div class="grid grid-cols-4 gap-2">
          <button *ngFor="let collab of team"
                  type="button"
                  (click)="form.assigned_to_id = collab.id!"
                  class="flex flex-col items-center gap-1 p-2 rounded-xl border transition-all"
                  [ngClass]="form.assigned_to_id === collab.id
                    ? 'border-green-400 bg-green-50 ring-2 ring-green-200'
                    : 'border-gray-200 hover:border-green-200 hover:bg-green-50'">
            <div class="w-8 h-8 rounded-full text-white flex items-center justify-center text-xs font-bold"
                 [ngClass]="getBgClass(collab.color)">
              {{ getInitials(collab) }}
            </div>
            <span class="text-[10px] text-gray-600 font-medium text-center leading-tight">
              {{ collab.first_name }}
            </span>
          </button>
        </div>
      </div>

      <!-- Titre -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Titre <span class="text-red-500">*</span>
        </label>
        <input type="text"
               [(ngModel)]="form.title"
               name="title"
               placeholder="Titre de la tâche..."
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none text-sm">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea [(ngModel)]="form.description"
                  name="description"
                  rows="2"
                  placeholder="Description optionnelle..."
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none text-sm resize-none">
        </textarea>
      </div>

      <!-- Date + Priorité côte à côte -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date d'échéance</label>
          <input type="date"
                 [(ngModel)]="form.due_date"
                 name="due_date"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priorité</label>
          <select [(ngModel)]="form.priority"
                  name="priority"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none text-sm bg-white">
            <option *ngFor="let p of priorities" [value]="p.value">{{ p.label }}</option>
          </select>
        </div>
      </div>

      <!-- Erreur -->
      <p *ngIf="errorMessage" class="text-sm text-red-500">{{ errorMessage }}</p>

      <!-- Actions -->
      <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
        <button type="button" (click)="cancelled.emit()"
                class="px-4 py-2 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
          Annuler
        </button>
        <button type="button" (click)="submit()" [disabled]="isLoading"
                class="px-4 py-2 text-sm text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50">
          <svg *ngIf="isLoading" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          {{ mode === 'assigned' ? 'Assigner' : 'Créer' }}
        </button>
      </div>
    </div>
  </div>
</div>
