<div class="space-y-3">

  <!-- Champ de recherche / création -->
  <div class="relative">
    <input
      [(ngModel)]="filter"
      type="text"
      placeholder="Filtrer ou créer une catégorie…"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent"
    />
  </div>

  <!-- Badges existants -->
  <div class="flex flex-wrap gap-2">
    @for (cat of filtered; track cat.id) {
      <button
        type="button"
        (click)="toggle(cat.id)"
        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm border transition-colors"
        [class]="isSelected(cat.id)
          ? 'bg-green-700 text-white border-green-700'
          : 'bg-white text-gray-600 border-gray-300 hover:border-green-400 hover:text-green-700'">
        <span
          class="w-2 h-2 rounded-full flex-shrink-0"
          [style.background-color]="isSelected(cat.id) ? 'rgba(255,255,255,0.7)' : cat.color">
        </span>
        {{ cat.name }}
      </button>
    }

    @if (filtered.length === 0 && filter && !showCreateButton) {
      <p class="text-sm text-gray-400 italic">Aucune catégorie trouvée.</p>
    }
  </div>

  <!-- Bouton créer -->
  @if (showCreateButton) {
    <button
      type="button"
      (click)="createCategory()"
      [disabled]="creating"
      class="inline-flex items-center gap-1.5 px-3 py-1 text-sm border border-dashed border-green-400 text-green-700 rounded-full hover:bg-green-50 transition-colors disabled:opacity-50">
      @if (creating) {
        <span class="w-3 h-3 border-2 border-green-500 border-t-transparent rounded-full animate-spin"></span>
      } @else {
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
      }
      Créer "{{ filter.trim() }}"
    </button>
  }

</div>
