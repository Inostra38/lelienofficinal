<div class="flex h-screen bg-gray-50 overflow-hidden">

  <app-sidebar 
      [team]="team" 
      [activeCollaborator]="activeSessionCollaborator"
      (sessionClick)="openSession($event)"
      (logout)="closeCollaboratorSession()">
  </app-sidebar>

  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <app-header (searchChange)="onSearch($event)"></app-header>
    
    <div class="absolute top-24 right-8 z-30">
      <button (click)="toggleEditMode()" 
              class="flex items-center gap-2 px-4 py-2 rounded-full shadow-sm border transition-all"
              [ngClass]="isEditMode ? 'bg-orange-100 border-orange-300 text-orange-700' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'">
        <span class="text-lg">{{ isEditMode ? '✅' : '✏️' }}</span>
        <span class="font-bold text-sm">{{ isEditMode ? 'Terminer' : 'Modifier' }}</span>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-8 scroll-smooth pt-16" cdkDropListGroup>
      <div class="max-w-7xl mx-auto w-full pb-20">

        <div class="space-y-12">
          <section *ngFor="let cat of allCategories">
            
            <div class="flex items-center gap-3 mb-6">
              <h2 class="text-xl font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                <span class="bg-gray-100 p-1.5 rounded text-lg">📂</span>
                {{ cat.nom }}
              </h2>
              <div class="h-px bg-gray-200 flex-1"></div>
            </div>

            <div cdkDropList 
                 [cdkDropListData]="cat.links" 
                 (cdkDropListDropped)="drop($event)"
                 class="grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-[100px]"> <div *ngFor="let link of cat.links" 
                   cdkDrag
                   [cdkDragDisabled]="!isEditMode"
                   (click)="openDetail(link)"
                   class="group relative bg-white rounded-2xl border transition-all duration-300 flex flex-col cursor-pointer overflow-hidden"
                   [ngClass]="{
                     'border-orange-200 shadow-orange-sm': link.pharmacy, 
                     'border-gray-200 hover:shadow-lg hover:border-blue-300': !link.pharmacy,
                     'animate-pulse border-dashed border-2': isEditMode
                   }">

                 <div class="p-5 flex items-start gap-4">
                    
                    <div class="w-16 h-16 rounded-xl flex items-center justify-center bg-gray-50 border border-gray-100 shrink-0">
                        <img *ngIf="link.partner?.logo" [src]="link.partner.logo" (error)="link.partner!.logo = null" class="w-full h-full object-contain p-2">
                        <span *ngIf="!link.partner?.logo" class="text-3xl opacity-50">
                            {{ (link.url && link.url.endsWith('.pdf')) ? '📄' : '🌐' }}
                        </span>
                    </div>

                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-gray-800 text-lg truncate">{{ link.titre }}</h3>
                                <span *ngIf="link.pharmacy" class="inline-block bg-orange-50 text-orange-600 text-[10px] font-bold px-2 py-0.5 rounded uppercase mt-1">Perso</span>
                                <span *ngIf="!link.pharmacy" class="inline-block bg-blue-50 text-blue-600 text-[10px] font-bold px-2 py-0.5 rounded uppercase mt-1">Officiel</span>
                            </div>

                            <button (click)="toggleFavorite(link, $event)" class="text-2xl hover:scale-110 transition-transform focus:outline-none">
                                {{ link.is_favorite ? '⭐' : '☆' }}
                            </button>
                        </div>

                        <p class="text-sm text-gray-500 mt-2 line-clamp-2">
                            {{ link.description || "Aucune description disponible pour cette ressource. Cliquez pour ajouter des notes personnelles." }}
                        </p>
                    </div>
                 </div>

                 <div class="mt-auto bg-gray-50/50 border-t border-gray-100 p-3 flex items-center gap-2">
                    
                    <a [href]="link.url" target="_blank" (click)="$event.stopPropagation()" 
                       class="flex-1 bg-white border border-gray-200 text-gray-700 px-3 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition-colors">
                       <span>🚀 Accéder</span>
                    </a>

                    <a *ngIf="link.document" [href]="link.document" target="_blank" (click)="$event.stopPropagation()"
                       class="bg-white border border-gray-200 text-gray-600 px-3 py-2 rounded-lg hover:bg-orange-50 hover:text-orange-600 transition-colors" title="Voir le document">
                       📄
                    </a>

                    <button (click)="openDetail(link); $event.stopPropagation()" class="bg-white border border-gray-200 text-gray-400 px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors" title="Notes & Détails">
                       ✏️
                    </button>

                 </div>

                 <div *ngIf="isEditMode" class="absolute inset-0 bg-white/50 backdrop-blur-[1px] flex items-center justify-center z-20 border-2 border-blue-400 rounded-2xl cursor-move">
                    <button *ngIf="link.pharmacy" (click)="deleteLink(link, $event)" class="bg-red-600 text-white px-4 py-2 rounded-full shadow-lg font-bold hover:bg-red-700 transform hover:scale-105 transition-all">
                        Supprimer
                    </button>
                    <div *ngIf="!link.pharmacy" class="bg-gray-800 text-white px-3 py-1 rounded-full text-xs opacity-70">
                        Verrouillé (Officiel)
                    </div>
                 </div>

              </div> </div> </section>
        </div>

      </div>
    </div>
  </main>
</div>

<button *ngIf="!isEditMode" 
        (click)="showAddModal = true" 
        class="fixed bottom-8 right-8 w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-xl flex items-center justify-center transition-all hover:scale-110 z-40 cursor-pointer">
  <span class="text-3xl leading-none mb-1">+</span>
</button>

<app-add-link-modal 
    *ngIf="showAddModal" 
    [categories]="allCategories"
    (close)="showAddModal = false"
    (addLink)="onLinkAdded($event)">
</app-add-link-modal>

<app-pin-pad 
    *ngIf="showPinPad" 
    [title]="'Code de ' + selectedCollaborator?.first_name"
    (cancel)="showPinPad = false"
    (pinComplete)="onPinEntered($event)">
</app-pin-pad>
