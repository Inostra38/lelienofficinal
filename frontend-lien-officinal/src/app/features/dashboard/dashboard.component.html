<div class="flex h-screen bg-gray-50 overflow-hidden">

  <app-sidebar 
      [team]="team" 
      [activeCollaborator]="activeSessionCollaborator"
      (sessionClick)="openSession($event)"
      (logout)="closeCollaboratorSession()">
  </app-sidebar>

  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <app-header 
        (searchChange)="onSearch($event)">
    </app-header>

    <div class="flex-1 overflow-y-auto p-8 scroll-smooth">
      <div class="max-w-6xl mx-auto w-full pb-20">

        <div class="space-y-10">
          <section *ngFor="let cat of displayedCategories">
            
            <div class="flex items-center gap-3 mb-5">
              <h2 class="text-lg font-bold text-gray-800 uppercase tracking-wide">{{ cat.nom }}</h2>
              <div class="h-px bg-gray-200 flex-1"></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
              <a *ngFor="let link of cat.links" 
                 [href]="link.url" 
                 target="_blank"
                 class="group relative bg-white p-4 rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_16px_rgba(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 flex items-start gap-4 overflow-hidden">
                 
                 <div class="absolute inset-x-0 bottom-0 h-1 bg-blue-500 scale-x-0 group-hover:scale-x-100 transition-transform duration-300 origin-left"></div>

                 <div class="w-14 h-14 rounded-xl bg-gray-50 border border-gray-100 flex items-center justify-center overflow-hidden shrink-0 group-hover:bg-white transition-colors relative">
                    <img *ngIf="link.partner?.logo" [src]="link.partner.logo" (error)="link.partner!.logo = null" class="w-full h-full object-contain p-2">
                    <span *ngIf="!link.partner?.logo" class="text-2xl opacity-60 grayscale group-hover:grayscale-0 transition-all">🔗</span>
                 </div>

                 <div class="flex-1 min-w-0 py-1">
                   <h3 class="font-bold text-gray-800 group-hover:text-blue-600 truncate text-[15px] mb-1">
                     {{ link.titre }}
                   </h3>
                   <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">
                     {{ link.partner ? '⭐ Partenaire officiel' : (link.description || 'Lien externe') }}
                   </p>
                 </div>
              </a>
            </div>
          </section>

          <div *ngIf="displayedCategories.length === 0" class="text-center py-20 opacity-60">
            <h3 class="text-lg font-bold text-gray-800">Aucun résultat trouvé</h3>
            <p class="text-gray-500 text-sm">Essayez un autre mot clé ou videz la recherche.</p>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<app-pin-pad 
    *ngIf="showPinPad" 
    [title]="'Code de ' + selectedCollaborator?.first_name"
    (cancel)="showPinPad = false"
    (pinComplete)="onPinEntered($event)">
</app-pin-pad>
