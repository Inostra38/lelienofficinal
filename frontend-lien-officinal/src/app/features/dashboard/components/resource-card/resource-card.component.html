<div
  (click)="onCardClick()"
  class="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md hover:border-green-400 transition-all duration-200 flex flex-col overflow-hidden relative h-full"
  [class.cursor-pointer]="!isEditMode"
  [class.cursor-default]="isEditMode">

  <!-- Edit mode actions -->
  <div *ngIf="isEditMode" class="absolute top-2 right-2 flex gap-1.5 z-20">
    <button
      (click)="moveCardRequest.emit({card: card, event: $event}); $event.stopPropagation()"
      class="w-7 h-7 flex items-center justify-center bg-green-50 text-green-700 rounded-full border border-green-100 hover:bg-green-700 hover:text-white transition-colors"
      title="Déplacer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
      </svg>
    </button>
    <button
      (click)="deleteCardRequest.emit({card: card, event: $event}); $event.stopPropagation()"
      class="w-7 h-7 flex items-center justify-center bg-red-50 text-red-500 rounded-full border border-red-100 hover:bg-red-500 hover:text-white transition-colors"
      title="Supprimer / masquer">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </button>
  </div>

  <!-- Card body -->
  <div class="p-4 flex flex-col flex-1 gap-3">

    <!-- Header: logo + name -->
    <div class="flex items-start gap-3">
      <!-- Logo square -->
      <div
        class="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 text-sm font-bold border"
        [style.background]="getLogoColors().bg"
        [style.color]="getLogoColors().text"
        [style.border-color]="getLogoColors().border">
        {{ getInitials() }}
      </div>

      <!-- Name + meta -->
      <div class="flex-1 min-w-0 pt-0.5">
        <div class="flex items-center gap-1.5 flex-wrap">
          <h3 class="font-bold text-gray-800 text-sm leading-snug break-words">{{ card.titre }}</h3>
          <svg
            *ngIf="card.type === 'OFFICIAL'"
            xmlns="http://www.w3.org/2000/svg"
            class="h-3.5 w-3.5 text-green-600 flex-shrink-0"
            viewBox="0 0 20 20"
            fill="currentColor"
            title="Ressource validée">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
          </svg>
          <span
            *ngIf="card.is_featured"
            class="px-1.5 py-0.5 rounded text-[10px] font-semibold uppercase tracking-wide bg-green-50 text-green-700 border border-green-100 flex-shrink-0">
            Nouveau
          </span>
        </div>
        <p class="text-xs mt-0.5" [ngClass]="getLinkCount() > 0 ? 'text-gray-400' : 'text-gray-300'">
          {{ getLinkCount() > 0 ? getLinkCount() + (getLinkCount() > 1 ? ' liens' : ' lien') : 'Aucun lien' }}
        </p>
      </div>
    </div>

    <!-- Description -->
    <p *ngIf="card.description_officielle" class="text-xs text-gray-500 line-clamp-2 flex-1 leading-relaxed">
      {{ card.description_officielle }}
    </p>
    <div *ngIf="!card.description_officielle" class="flex-1"></div>

    <!-- Note courte -->
    <div *ngIf="card.note_courte" class="bg-yellow-50 border border-yellow-100 rounded-lg px-2.5 py-1.5">
      <p class="text-xs text-yellow-800 line-clamp-1">📌 {{ card.note_courte }}</p>
    </div>

    <!-- Footer: category tag + actions -->
    <div class="flex items-center justify-between pt-2 border-t border-gray-100 mt-auto">

      <!-- Category tag -->
      <span
        *ngIf="categoryName"
        class="px-2 py-0.5 rounded-full text-[10px] font-medium border truncate max-w-[120px]"
        [style.background]="getLogoColors().bg"
        [style.color]="getLogoColors().text"
        [style.border-color]="getLogoColors().border">
        {{ categoryName }}
      </span>
      <span *ngIf="!categoryName" class="flex-1"></span>

      <!-- Actions -->
      <div class="flex items-center gap-0.5 flex-shrink-0">
        <!-- Favorite -->
        <button
          (click)="favoriteToggle.emit({card: card, event: $event}); $event.stopPropagation()"
          class="w-7 h-7 flex items-center justify-center rounded-lg transition-colors"
          [class.text-red-500]="card.is_favorite"
          [class.text-gray-300]="!card.is_favorite"
          [class.hover\:text-red-400]="!card.is_favorite"
          title="{{ card.is_favorite ? 'Retirer des favoris' : 'Ajouter aux favoris' }}">
          <svg *ngIf="card.is_favorite" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"/>
          </svg>
          <svg *ngIf="!card.is_favorite" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
        </button>

        <!-- Share (cosmetic) -->
        <button
          (click)="$event.stopPropagation()"
          class="w-7 h-7 flex items-center justify-center rounded-lg text-gray-300 hover:text-gray-500 transition-colors"
          title="Partager">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>
