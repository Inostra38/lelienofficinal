<header class="bg-white/80 backdrop-blur-md border-b border-gray-200 px-8 py-5 z-10 sticky top-0">
  <div class="max-w-7xl w-full">  <!-- ✅ Retiré mx-auto -->
    
    <div class="flex flex-col gap-4">
      
      <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-3">
        Tableau de bord 
        <span class="h-1.5 w-1.5 rounded-full bg-gray-300"></span>
        <span class="text-gray-500 font-normal text-lg">{{ pharmacyName }}</span>
      </h1>

      <div class="relative w-full max-w-2xl">  <!-- ✅ Déjà aligné à gauche -->
        
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
        </div>
        
        <input type="text" 
               [(ngModel)]="searchTerm" 
               (input)="onSearch()"
               placeholder="Rechercher un laboratoire, un grossiste, un outil..." 
               class="w-full pl-11 pr-16 py-3 bg-gray-100 border-transparent focus:bg-white focus:ring-2 focus:ring-green-500 focus:border-transparent rounded-xl text-gray-800 placeholder-gray-500 transition-all shadow-sm text-sm font-medium">
        
        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
          
        </div>

      </div>

    </div>

  </div>
</header>
