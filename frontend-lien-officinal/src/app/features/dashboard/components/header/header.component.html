<header class="bg-white border-b border-gray-200 px-6 py-3 z-20 sticky top-0 flex items-center gap-4 shrink-0">

  <!-- Left: brand + title -->
  <div class="flex items-center gap-3 flex-shrink-0">
    <div class="w-8 h-8 bg-green-700 rounded-lg flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
      </svg>
    </div>
    <div class="hidden sm:block">
      <p class="text-sm font-bold text-gray-800 leading-tight">Raccourcis</p>
      <p *ngIf="pharmacyName" class="text-xs text-gray-400 leading-tight truncate max-w-[160px]">{{ pharmacyName }}</p>
    </div>
  </div>

  <!-- Bell (cosmetic) -->
  <button class="w-9 h-9 flex items-center justify-center rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors flex-shrink-0" title="Notifications">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
  </button>

  <!-- Search -->
  <div class="flex-1 max-w-xl relative">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
      </svg>
    </div>
    <input
      type="search"
      autocomplete="off"
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      placeholder="Rechercher un labo, un outil, un document…"
      class="w-full pl-9 pr-4 py-2 bg-gray-100 border border-transparent focus:bg-white focus:border-green-300 focus:ring-2 focus:ring-green-100 rounded-xl text-sm text-gray-800 placeholder-gray-400 transition-all outline-none">
  </div>
</header>
