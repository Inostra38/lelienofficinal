<div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 transition-opacity" (click)="close.emit()"></div>

<div class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-2xl z-50 flex flex-col animate-in slide-in-from-right duration-300">
  
  <!-- HEADER -->
  <div class="p-6 border-b border-gray-100 flex items-start gap-4 bg-gray-50/50">
    <div class="w-16 h-16 rounded-2xl bg-white border border-gray-200 flex items-center justify-center shrink-0 shadow-sm p-2">
      <img *ngIf="card.logo" [src]="card.logo" class="w-full h-full object-contain">
      <span *ngIf="!card.logo" class="text-3xl">🏢</span>
    </div>
    
    <div class="flex-1 pt-1">
      <h2 class="text-xl font-bold text-gray-800 leading-tight">{{ card.titre }}</h2>
      <div class="flex gap-2 mt-2">
        <span *ngIf="card.type === 'OFFICIAL'" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold uppercase">Validé</span>
        <span *ngIf="card.type === 'PARTNER'" class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full font-bold uppercase">Partenaire</span>
        <span *ngIf="card.type === 'PRIVATE'" class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-bold uppercase">Perso</span>
      </div>
    </div>

    <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center transition-colors">✕</button>
  </div>

  <!-- ONGLETS -->
  <div class="flex border-b border-gray-200 px-6">
    <button (click)="activeTab = 'INFO'" class="py-3 px-4 text-sm font-medium border-b-2 transition-colors" [ngClass]="activeTab === 'INFO' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'">
      Ressources
    </button>
    <button (click)="activeTab = 'NOTES'" class="py-3 px-4 text-sm font-medium border-b-2 transition-colors" [ngClass]="activeTab === 'NOTES' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'">
      Notes
    </button>
  </div>

  <!-- CONTENU -->
  <div class="flex-1 overflow-y-auto p-6">
    
    <!-- ONGLET RESSOURCES -->
    <div *ngIf="activeTab === 'INFO'" class="space-y-6">
      
      <p *ngIf="card.description_officielle" class="text-gray-600 text-sm bg-gray-50 p-3 rounded-lg border border-gray-100">
        {{ card.description_officielle }}
      </p>

      <!-- NOTE COURTE (Aperçu rapide) -->
      <div *ngIf="card.note_courte" class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-yellow-600">📌</span>
          <span class="text-xs font-bold text-yellow-700 uppercase">Mémo</span>
        </div>
        <p class="text-sm text-yellow-800">{{ card.note_courte }}</p>
      </div>

      <div class="border-t border-gray-100 pt-4">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Liens & Docs</h3>
            <button (click)="showAddForm = !showAddForm" class="text-xs text-blue-600 font-bold hover:underline">
                {{ showAddForm ? 'Annuler' : '+ Ajouter un lien perso' }}
            </button>
        </div>

        <!-- Formulaire d'ajout de lien -->
        <div *ngIf="showAddForm" class="bg-blue-50 p-4 rounded-xl mb-4 border border-blue-100 animate-in slide-in-from-top-2">
            <div class="space-y-3">
                <input type="text" [(ngModel)]="newItem.label" placeholder="Nom (ex: Mon planning)" class="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="flex gap-2">
                    <select [(ngModel)]="newItem.type" class="p-2 border rounded text-sm bg-white">
                        <option value="WEB">Web</option>
                        <option value="PDF">PDF</option>
                    </select>
                    <input *ngIf="newItem.type === 'WEB'" type="text" [(ngModel)]="newItem.url" placeholder="https://..." class="flex-1 p-2 border rounded text-sm">
                    <input *ngIf="newItem.type === 'PDF'" type="file" (change)="onFileSelected($event)" class="flex-1 p-2 border rounded text-sm bg-white">
                </div>
                <button (click)="addItem()" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">Valider</button>
            </div>
        </div>

        <!-- Liste des liens -->
        <div class="space-y-2">
          <div *ngIf="!card.items || card.items.length === 0" class="text-sm text-gray-400 italic text-center py-2">Aucun lien</div>

          <a *ngFor="let item of card.items" [href]="item.final_url" target="_blank"
             class="flex items-center gap-3 p-3 rounded-xl border border-gray-200 hover:border-blue-400 hover:shadow-md transition-all bg-white group">
             <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-sm text-gray-500 group-hover:text-blue-600 group-hover:bg-blue-50">
                <span *ngIf="item.type === 'WEB'">🌐</span>
                <span *ngIf="item.type === 'PDF'">📄</span>
                <span *ngIf="item.type === 'TEL'">📞</span>
             </div>
             <span class="flex-1 text-sm font-bold text-gray-700 group-hover:text-blue-700 truncate">{{ item.label }}</span>
             <span class="text-gray-300 group-hover:text-blue-500">→</span>
          </a>
        </div>
      </div>
    </div>

    <!-- ONGLET NOTES -->
    <div *ngIf="activeTab === 'NOTES'" class="space-y-6">
      
      <!-- Note courte -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">
          📌 Mémo rapide
          <span class="font-normal text-gray-400 ml-2">(visible sur la carte)</span>
        </label>
        <div class="relative">
          <input type="text" 
                 [(ngModel)]="editableNoteCourte"
                 maxlength="150"
                 placeholder="Ex: Identifiants dans le tiroir, contacter Marie..."
                 class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none pr-16">
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400">
            {{ editableNoteCourte.length }}/150
          </span>
        </div>
      </div>

      <!-- Note longue -->
      <div class="flex-1 flex flex-col">
        <label class="block text-sm font-bold text-gray-700 mb-2">
          📝 Notes détaillées
          <span class="font-normal text-gray-400 ml-2">(procédures, infos...)</span>
        </label>
        <textarea [(ngModel)]="editableNoteLongue" 
                  rows="8"
                  class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 focus:bg-white transition-colors resize-none" 
                  placeholder="Notes détaillées, procédures, informations importantes..."></textarea>
      </div>

      <!-- Bouton sauvegarder -->
      <button (click)="saveNotes()" 
              [disabled]="isSaving"
              class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span *ngIf="isSaving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        {{ isSaving ? 'Enregistrement...' : 'Enregistrer les notes' }}
      </button>

      <!-- Message de confirmation -->
      <div *ngIf="saveSuccess" class="text-center text-green-600 text-sm font-medium animate-in fade-in">
        ✅ Notes enregistrées !
      </div>

    </div>

  </div>
</div>
