<div class="month-grid-wrapper p-4" (click)="closePopup()">

  <!-- En-têtes jours -->
  <div class="month-header-grid mb-1">
    <div></div><!-- colonne numéro de semaine -->
    <div *ngFor="let label of DAY_LABELS"
         class="text-center text-xs font-semibold text-gray-400 uppercase tracking-wide py-2">
      {{ label }}
    </div>
  </div>

  <!-- Lignes du calendrier -->
  <div *ngFor="let row of calendarRows" class="month-week-row">

    <!-- Numéro de semaine -->
    <div class="week-num-cell">S{{ row.weekNumber }}</div>

    <!-- Cases du calendrier -->
    <div *ngFor="let day of row.days"
         class="month-cell rounded-xl border transition-all relative"
         [class.opacity-30]="!day.isCurrentMonth"
         [class.pointer-events-none]="!day.isCurrentMonth"
         [class.border-green-400]="day.isToday"
         [class.bg-green-50]="day.isToday && !day.dayStatus"
         [class.border-gray-100]="!day.isToday && !day.dayStatus"
         [class.bg-white]="!day.isToday && !day.dayStatus"
         [ngClass]="getCellClass(day)"
         (click)="onDayClick(day)">

      <!-- Numéro du jour + badges + bouton -->
      <div class="flex items-center justify-between px-2 pt-2 pb-1">
        <span class="text-sm font-bold"
              [class.text-green-700]="day.isToday"
              [class.text-gray-300]="!day.isToday && day.dayStatus?.status === 'closed' && !day.dayStatus?.on_call_day && !day.dayStatus?.on_call_night"
              [class.line-through]="day.dayStatus?.status === 'closed' && !day.dayStatus?.on_call_day && !day.dayStatus?.on_call_night"
              [class.text-gray-700]="!day.isToday && !(day.dayStatus?.status === 'closed' && !day.dayStatus?.on_call_day && !day.dayStatus?.on_call_night)">
          {{ day.date.getDate() }}
        </span>

        <div class="flex items-center gap-0.5">
          <!-- Badges J / N / F(fermé) / F(férié) -->
          <span *ngFor="let badge of getStatusBadges(day)"
                class="month-badge"
                [ngClass]="badge.cls"
                [title]="badge.title">
            {{ badge.label }}
          </span>

          <!-- Bouton statut (manager, jours non passés) -->
          <button *ngIf="isManager && !day.isPast && day.isCurrentMonth"
                  (click)="openStatusPopup(day, $event)"
                  class="w-4 h-4 rounded flex items-center justify-center opacity-0 hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-all month-status-btn ml-0.5"
                  title="Modifier le statut">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Shift count -->
      <div *ngIf="day.shifts.length > 0"
           class="px-2 mb-0.5 text-[10px] text-gray-400 font-medium">
        {{ day.shifts.length }} shift{{ day.shifts.length > 1 ? 's' : '' }}
      </div>

      <!-- Puces collaborateurs -->
      <div class="flex flex-wrap gap-1 px-2 min-h-[16px]">
        <span *ngFor="let dot of getCollaboratorDots(day)"
              class="w-2 h-2 rounded-full flex-shrink-0"
              [ngClass]="getBgClass(dot.color)"
              [title]="dot.name">
        </span>
      </div>

      <!-- Initiales absences -->
      <div *ngIf="getDayAbsences(day).length > 0"
           class="flex flex-wrap items-center gap-0.5 px-2 pb-1.5 mt-0.5">
        <span *ngFor="let abs of getAbsenceInitials(day)"
              class="absence-initial"
              [title]="abs.initials + ' · ' + abs.type"
              [ngClass]="'bg-' + abs.color + '-100 text-' + abs.color + '-700'">
          {{ abs.initials }}
        </span>
        <span *ngIf="getAbsenceOverflow(day) > 0"
              class="absence-overflow">
          +{{ getAbsenceOverflow(day) }}
        </span>
      </div>

      <!-- Popup statut -->
      <div *ngIf="popupDay?.iso === day.iso"
           class="status-popup"
           (click)="$event.stopPropagation()">

        <!-- Ouvert / Fermé -->
        <div class="status-section-label">Statut</div>
        <div class="flex gap-1 mb-2">
          <button (click)="setOpenClosed('open')"
                  class="status-toggle-btn"
                  [class.active-open]="currentStatus(day) === 'open'">
            <span class="status-dot open"></span> Ouvert
          </button>
          <button (click)="setOpenClosed('closed')"
                  class="status-toggle-btn"
                  [class.active-closed]="currentStatus(day) === 'closed'">
            <span class="status-dot closed"></span> Fermé
          </button>
        </div>

        <!-- Gardes -->
        <div class="status-section-label">Gardes</div>

        <button (click)="toggleOnCallDay()"
                class="status-check-row"
                [class.active-guard-day]="day.dayStatus?.on_call_day">
          <span class="check-box" [class.checked]="day.dayStatus?.on_call_day">
            <svg *ngIf="day.dayStatus?.on_call_day" class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </span>
          <span class="check-label">{{ guardDayLabel() }}</span>
        </button>

        <button (click)="toggleOnCallNight()"
                class="status-check-row"
                [class.active-guard-night]="day.dayStatus?.on_call_night">
          <span class="check-box night" [class.checked]="day.dayStatus?.on_call_night">
            <svg *ngIf="day.dayStatus?.on_call_night" class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
          </span>
          <span class="check-label">{{ guardNightLabel() }}</span>
        </button>

        <button (click)="popupDay = null" class="status-cancel">Fermer</button>

      </div>

    </div>
  </div>

</div>
