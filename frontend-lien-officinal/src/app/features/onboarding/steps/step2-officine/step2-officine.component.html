<div class="bg-white rounded-2xl shadow p-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-1">Mon officine</h1>
  <p class="text-gray-500 mb-6">Quelques informations sur votre pharmacie.</p>

  @if (error) {
    <div class="bg-red-50 text-red-700 rounded-lg p-3 mb-4 text-sm">{{ error }}</div>
  }

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Nom de l'officine <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        [(ngModel)]="nomOfficine"
        name="nomOfficine"
        required
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="Pharmacie du Centre" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Ville <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        [(ngModel)]="city"
        name="city"
        required
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="Paris" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        SIRET <span class="text-gray-400 text-xs font-normal">(optionnel)</span>
      </label>
      <input
        type="text"
        [(ngModel)]="siret"
        name="siret"
        maxlength="14"
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="14 chiffres" />
    </div>

    <div class="flex gap-3 pt-2">
      <button
        type="button"
        (click)="onboarding.prevStep()"
        class="flex-1 border border-gray-300 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-50 transition">
        Retour
      </button>
      <button
        type="submit"
        [disabled]="loading"
        class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">
        {{ loading ? 'Enregistrement...' : 'Continuer' }}
      </button>
    </div>
  </form>
</div>
