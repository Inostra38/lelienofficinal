<div class="bg-white rounded-2xl shadow p-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-1">Centres d'intérêt</h1>
  <p class="text-gray-500 mb-6">Sélectionnez les thématiques qui correspondent à votre officine.</p>

  @if (error) {
    <div class="bg-red-50 text-red-700 rounded-lg p-3 mb-4 text-sm">{{ error }}</div>
  }

  <div class="grid grid-cols-3 gap-3 mb-6">
    @for (cat of categories; track cat.nom) {
      <button
        type="button"
        (click)="toggle(cat)"
        [class.border-green-600]="cat.selected"
        [class.bg-green-50]="cat.selected"
        [class.text-green-700]="cat.selected"
        [class.border-gray-200]="!cat.selected"
        [class.text-gray-600]="!cat.selected"
        class="border-2 rounded-xl p-3 text-center text-sm font-medium transition hover:border-green-400">
        {{ cat.nom }}
      </button>
    }
  </div>

  <p class="text-xs text-gray-400 mb-4">
    {{ selectedCount }} sélectionné{{ selectedCount > 1 ? 's' : '' }}
  </p>

  <div class="flex gap-3">
    <button
      type="button"
      (click)="onboarding.prevStep()"
      class="flex-1 border border-gray-300 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-50 transition">
      Retour
    </button>
    <button
      type="button"
      (click)="submit()"
      [disabled]="loading || selectedCount === 0"
      class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">
      {{ loading ? 'Enregistrement...' : 'Continuer' }}
    </button>
  </div>
</div>
