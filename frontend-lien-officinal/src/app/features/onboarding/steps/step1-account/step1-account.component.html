<div class="bg-white rounded-2xl shadow p-8">
  <h1 class="text-2xl font-bold text-gray-800 mb-1">Créer mon compte</h1>
  <p class="text-gray-500 mb-6">Commençons par vos identifiants de connexion.</p>

  @if (error) {
    <div class="bg-red-50 text-red-700 rounded-lg p-3 mb-4 text-sm">{{ error }}</div>
  }

  <form (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Adresse email</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="pharmacie@example.com" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        minlength="8"
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="8 caractères minimum" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Confirmer le mot de passe</label>
      <input
        type="password"
        [(ngModel)]="passwordConfirm"
        name="passwordConfirm"
        required
        class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="Répétez votre mot de passe" />
    </div>

    <button
      type="submit"
      [disabled]="loading"
      class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">
      {{ loading ? 'Création...' : 'Continuer' }}
    </button>
  </form>
</div>
