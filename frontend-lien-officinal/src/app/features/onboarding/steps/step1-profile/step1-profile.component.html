<div>
  <h2 class="text-xl font-bold text-gray-900 mb-1">Mon officine</h2>
  <p class="text-sm text-gray-500 mb-6">Ces informations seront affichées dans votre espace.</p>

  <div class="space-y-5">
    <div>
      <label for="nomOfficine" class="block text-sm font-medium text-gray-700 mb-1">
        Nom de l'officine <span class="text-red-500">*</span>
      </label>
      <input
        id="nomOfficine"
        type="text"
        [(ngModel)]="nomOfficine"
        placeholder="Pharmacie de la Place"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition-all"
      />
    </div>

    <div>
      <label for="city" class="block text-sm font-medium text-gray-700 mb-1">
        Ville <span class="text-red-500">*</span>
        @if (cityReadonly) {
          <span class="ml-2 text-xs font-normal text-green-700 bg-green-50 px-2 py-0.5 rounded-full">déjà renseignée</span>
        }
      </label>
      <input
        id="city"
        type="text"
        [(ngModel)]="city"
        placeholder="Paris"
        [readonly]="cityReadonly"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none transition-all"
        [class.focus:ring-2]="!cityReadonly"
        [class.focus:ring-green-500]="!cityReadonly"
        [class.bg-gray-50]="cityReadonly"
        [class.text-gray-500]="cityReadonly"
        [class.cursor-not-allowed]="cityReadonly"
      />
    </div>
  </div>

  <div class="mt-8 flex justify-end">
    <button
      (click)="onNext()"
      [disabled]="!isValid"
      class="bg-green-700 hover:bg-green-800 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold px-6 py-2.5 rounded-lg transition-colors"
    >
      Suivant →
    </button>
  </div>
</div>
