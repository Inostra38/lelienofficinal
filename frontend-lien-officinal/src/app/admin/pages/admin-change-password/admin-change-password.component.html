<div class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-green-700 text-white rounded-full flex items-center justify-center text-xl mx-auto mb-3">
        🔑
      </div>
      <h2 class="text-xl font-bold text-gray-800">Changer le mot de passe</h2>
      <p class="text-sm text-gray-400 mt-1">Minimum 12 caractères avec majuscule, minuscule, chiffre et caractère spécial</p>
    </div>

    <form (submit)="submit(); $event.preventDefault()" class="space-y-4">

      <!-- Ancien mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe actuel</label>
        <input type="password" [(ngModel)]="oldPassword" name="oldPassword" required autocomplete="current-password"
               class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-200" />
      </div>

      <!-- Nouveau mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nouveau mot de passe</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required autocomplete="new-password"
               class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-200" />

        <!-- Indicateurs de force -->
        <div *ngIf="newPassword" class="mt-2 space-y-1">
          <div *ngFor="let rule of [
            { label: '12 caractères minimum', ok: newPassword.length >= 12 },
            { label: '1 majuscule', ok: newPassword.match('[A-Z]') },
            { label: '1 minuscule', ok: newPassword.match('[a-z]') },
            { label: '1 chiffre', ok: newPassword.match('[0-9]') },
            { label: '1 caractère spécial', ok: newPassword.match('[^A-Za-z0-9]') }
          ]"
               class="flex items-center gap-1.5 text-xs"
               [ngClass]="rule.ok ? 'text-green-600' : 'text-gray-400'">
            <svg *ngIf="rule.ok" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            <svg *ngIf="!rule.ok" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
            </svg>
            {{ rule.label }}
          </div>
        </div>
      </div>

      <!-- Confirmation -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmer le nouveau mot de passe</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password"
               class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-200" />
        <p *ngIf="confirmPassword && newPassword !== confirmPassword"
           class="text-xs text-red-500 mt-1">Les mots de passe ne correspondent pas.</p>
      </div>

      <!-- Erreur -->
      <div *ngIf="errorMessage" class="bg-red-50 text-red-600 text-sm p-3 rounded-xl border border-red-100">
        {{ errorMessage }}
      </div>

      <!-- Succès -->
      <div *ngIf="successMessage" class="bg-green-50 text-green-700 text-sm p-3 rounded-xl border border-green-100">
        {{ successMessage }}
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="saving || !isValid"
              class="w-full bg-green-700 hover:bg-green-800 disabled:opacity-40 text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
        <span *ngIf="saving" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        {{ saving ? 'Modification...' : 'Modifier le mot de passe' }}
      </button>
    </form>
  </div>
</div>
