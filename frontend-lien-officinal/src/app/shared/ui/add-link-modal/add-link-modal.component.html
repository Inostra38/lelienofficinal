<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">

    <!-- HEADER -->
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center shrink-0">
      <h3 class="font-bold text-gray-800 text-lg">Ajouter une ressource</h3>
      <button (click)="close.emit()"
        class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-6">

      <!-- ÉTAPE CHOIX -->
      <div *ngIf="step === 'CHOICE'" class="grid grid-cols-2 gap-4">

        <!-- Ressource personnelle -->
        <button (click)="step = 'RESOURCE'; addItem()"
          class="p-5 border-2 border-gray-100 bg-white rounded-xl hover:border-green-400 hover:shadow-md transition-all flex flex-col items-center gap-3 group text-center h-36 justify-center">
          <div class="w-10 h-10 rounded-xl bg-green-50 text-green-700 flex items-center justify-center group-hover:bg-green-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
          </div>
          <div>
            <p class="font-semibold text-gray-800 text-sm">Ressource personnelle</p>
            <p class="text-xs text-gray-400 mt-0.5">Lien, document, contact…</p>
          </div>
        </button>

        <!-- Ressources partagées -->
        <button (click)="goToSharedResources()"
          class="p-5 border-2 border-gray-100 bg-white rounded-xl hover:border-green-400 hover:shadow-md transition-all flex flex-col items-center gap-3 group text-center h-36 justify-center">
          <div class="w-10 h-10 rounded-xl bg-green-50 text-green-700 flex items-center justify-center group-hover:bg-green-100 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
          </div>
          <div>
            <p class="font-semibold text-gray-800 text-sm">Ressources partagées</p>
            <p class="text-xs text-gray-400 mt-0.5">Ressources validées par la communauté</p>
          </div>
        </button>
      </div>

      <!-- ÉTAPE RESSOURCE -->
      <div *ngIf="step === 'RESOURCE'" class="space-y-4">

        <button (click)="step = 'CHOICE'; resetForm()"
          class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-600 transition-colors mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Retour
        </button>

        <!-- SECTION 1 : INFORMATIONS GÉNÉRALES -->
        <div class="border border-gray-100 rounded-xl overflow-hidden">
          <button (click)="toggleSection('info')"
            class="w-full px-5 py-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors">
            <div class="flex items-center gap-2.5">
              <div class="w-6 h-6 rounded-lg bg-green-100 text-green-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
              <span class="font-semibold text-gray-700 text-sm">Informations générales</span>
              <span class="text-xs text-red-400">*obligatoire</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 transition-transform"
              [class.rotate-180]="sectionsOpen.info" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div *ngIf="sectionsOpen.info" class="p-5 space-y-4 bg-white">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Titre <span class="text-red-400">*</span></label>
              <input type="text" [(ngModel)]="resourceForm.titre" placeholder="Ex : Ameli Pro, Planning équipe…"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Catégorie <span class="text-red-400">*</span></label>
              <select [(ngModel)]="resourceForm.category"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-green-200">
                <option value="" disabled selected>— Choisir une catégorie —</option>
                <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.nom }}</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Description courte
                <span class="text-gray-400">(affichée sur la carte)</span>
              </label>
              <input type="text" [(ngModel)]="resourceForm.description_courte" maxlength="150"
                placeholder="Ex : Portail télétransmissions…"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
              <p class="text-xs text-gray-400 mt-1 text-right">{{ resourceForm.description_courte.length }}/150</p>
            </div>
          </div>
        </div>

        <!-- SECTION 2 : LIENS & DOCUMENTS -->
        <div class="border border-gray-100 rounded-xl overflow-hidden">
          <button (click)="toggleSection('items')"
            class="w-full px-5 py-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors">
            <div class="flex items-center gap-2.5">
              <div class="w-6 h-6 rounded-lg bg-green-100 text-green-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                </svg>
              </div>
              <span class="font-semibold text-gray-700 text-sm">Liens & Documents ({{ items.length }})</span>
              <span class="text-xs text-red-400">*au moins 1</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 transition-transform"
              [class.rotate-180]="sectionsOpen.items" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div *ngIf="sectionsOpen.items" class="p-5 space-y-3 bg-white">
            <div *ngIf="items.length === 0"
              class="text-center py-8 text-sm text-gray-400 border-2 border-dashed border-gray-100 rounded-xl">
              Ajoutez au moins un lien ou document
            </div>

            <div *ngFor="let item of items; let i = index"
              class="border border-gray-100 rounded-xl p-4 bg-gray-50 space-y-3">
              <div class="flex justify-between items-center">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wide">Élément {{ i + 1 }}</span>
                <button (click)="removeItem(item.tempId)"
                  class="text-gray-300 hover:text-red-500 transition-colors">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs text-gray-500 mb-1">Type</label>
                  <select [(ngModel)]="item.type"
                    class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-green-200">
                    <option value="WEB">Lien Web</option>
                    <option value="PDF">Document PDF</option>
                    <option value="TEL">Téléphone</option>
                    <option value="MAIL">Email</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs text-gray-500 mb-1">Libellé <span class="text-red-400">*</span></label>
                  <input type="text" [(ngModel)]="item.label" placeholder="Ex : Site officiel"
                    class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
                </div>
              </div>

              <div *ngIf="item.type === 'WEB'">
                <label class="block text-xs text-gray-500 mb-1">URL <span class="text-red-400">*</span></label>
                <input type="url" [(ngModel)]="item.url" placeholder="https://…"
                  class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
              </div>
              <div *ngIf="item.type === 'PDF'">
                <label class="block text-xs text-gray-500 mb-1">Fichier <span class="text-red-400">*</span></label>
                <input type="file" (change)="onItemFileSelected($event, item)" accept=".pdf,.doc,.docx,.jpg,.png"
                  class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white"/>
              </div>
              <div *ngIf="item.type === 'TEL'">
                <label class="block text-xs text-gray-500 mb-1">Numéro <span class="text-red-400">*</span></label>
                <input type="tel" [(ngModel)]="item.url" placeholder="01 23 45 67 89"
                  class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
              </div>
              <div *ngIf="item.type === 'MAIL'">
                <label class="block text-xs text-gray-500 mb-1">Email <span class="text-red-400">*</span></label>
                <input type="email" [(ngModel)]="item.url" placeholder="contact@exemple.fr"
                  class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
              </div>
            </div>

            <button (click)="addItem()"
              class="w-full py-3 border-2 border-dashed border-gray-200 rounded-xl text-sm text-gray-400 hover:border-green-400 hover:text-green-700 hover:bg-green-50 transition-all font-medium">
              + Ajouter un lien / document
            </button>
          </div>
        </div>

        <!-- SECTION 3 : NOTES PERSONNELLES -->
        <div class="border border-gray-100 rounded-xl overflow-hidden">
          <button (click)="toggleSection('notes')"
            class="w-full px-5 py-4 bg-gray-50 hover:bg-gray-100 flex justify-between items-center transition-colors">
            <div class="flex items-center gap-2.5">
              <div class="w-6 h-6 rounded-lg bg-green-100 text-green-700 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
              </div>
              <span class="font-semibold text-gray-700 text-sm">Notes personnelles</span>
              <span class="text-xs text-gray-400">optionnel</span>
            </div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 transition-transform"
              [class.rotate-180]="sectionsOpen.notes" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <div *ngIf="sectionsOpen.notes" class="p-5 space-y-4 bg-white">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">
                Mémo rapide
                <span class="text-gray-400 font-normal">(visible sur la carte)</span>
              </label>
              <input type="text" [(ngModel)]="resourceForm.note_courte" maxlength="150"
                placeholder="Ex : Identifiants dans le tiroir…"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-green-200"/>
              <p class="text-xs text-gray-400 mt-1 text-right">{{ resourceForm.note_courte.length }}/150</p>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Notes détaillées</label>
              <textarea [(ngModel)]="resourceForm.note_longue" rows="4"
                placeholder="Procédures, informations importantes…"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm resize-none focus:outline-none focus:ring-2 focus:ring-green-200">
              </textarea>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- FOOTER -->
    <div *ngIf="step === 'RESOURCE'"
      class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-between items-center shrink-0">
      <button (click)="step = 'CHOICE'; resetForm()"
        class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700 transition-colors">
        Annuler
      </button>
      <button (click)="submitResource()" [disabled]="!isFormValid()"
        class="flex items-center gap-2 bg-green-700 hover:bg-green-800 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed text-white font-semibold px-6 py-2.5 rounded-xl transition-colors text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        Créer la ressource
      </button>
    </div>

  </div>
</div>
