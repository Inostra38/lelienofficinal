<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-in zoom-in duration-200">
    
    <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
      <h3 class="font-bold text-gray-800 text-lg">Classer la ressource</h3>
      <button (click)="cancel.emit()" class="text-gray-400 hover:text-gray-600">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <p class="text-sm text-gray-600">
        Où souhaitez-vous placer la carte **{{ cardToAssign.titre }}** ?
      </p>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Choisir une catégorie</label>
        <select [(ngModel)]="selectedCategoryId" name="category" required 
                class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-green-500 outline-none">
          <option [value]="null" disabled>-- Sélectionner --</option>
          <option *ngFor="let cat of categories" [value]="cat.id">
            📂 {{ cat.nom }}
          </option>
        </select>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
        <button type="button" (click)="cancel.emit()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">Annuler</button>
        <button type="submit" [disabled]="!selectedCategoryId" class="px-6 py-2 bg-green-700 text-white rounded-lg hover:bg-green-800 disabled:opacity-50">
          Placer
        </button>
      </div>
    </form>

  </div>
</div>
