<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]">
  
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-[320px] overflow-hidden transform animate-[zoomIn_0.2s_ease-out]">
    
    <div class="bg-gray-50 p-6 text-center border-b border-gray-100 relative">
      
      <button (click)="cancel.emit()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h3 class="text-lg font-bold text-gray-800">{{ title }}</h3>
      
      <div class="flex justify-center gap-4 mt-6 h-4">
        <div *ngFor="let dot of [1,2,3,4]; let i = index"
             class="w-3 h-3 rounded-full transition-all duration-300 border border-gray-300"
             [ngClass]="{
               'bg-red-500 border-red-500 scale-125 animate-bounce': error,
               'bg-green-600 border-green-600 scale-125': !error && i < pin.length,
               'bg-white': !error && i >= pin.length
             }">
        </div>
      </div>
    </div>

    <div class="p-6 bg-white">
      <div class="grid grid-cols-3 gap-y-6 gap-x-4">
        
        <button *ngFor="let key of keys"
                (click)="onKeyClick(key)"
                [disabled]="key === ''"
                class="h-16 w-16 mx-auto rounded-full flex items-center justify-center text-2xl font-semibold transition-all select-none"
                [ngClass]="{
                  'bg-gray-50 hover:bg-gray-100 active:bg-gray-200 text-gray-800 shadow-sm border border-gray-100': key !== '' && key !== '⌫',
                  'text-red-500 hover:bg-red-50 active:scale-90': key === '⌫',
                  'invisible pointer-events-none': key === ''
                }">
          <span *ngIf="key !== '⌫'">{{ key }}</span>
          <span *ngIf="key === '⌫'">⌫</span>
        </button>

      </div>
    </div>

  </div>
</div>
