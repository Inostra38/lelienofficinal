<!-- inactivity-ad-overlay.component.html -->
<div *ngIf="isVisible && currentAd"
     class="fixed inset-0 z-[9999] flex items-center justify-center animate-in fade-in duration-500"
     (mousemove)="onActivity()"
     (click)="onActivity()">
  
  <div class="absolute inset-0 bg-black/40 backdrop-blur-md"></div>

  <div class="relative z-10 max-w-4xl w-full mx-4 animate-in zoom-in-95 duration-700">
    
    <div class="absolute -top-12 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur px-4 py-2 rounded-full text-sm font-medium text-gray-700 shadow-lg animate-bounce">
      <span class="inline-block mr-2">🖱️</span>
      Bougez la souris pour continuer
    </div>

    <a [href]="currentAd.link_url || '#'" 
       [target]="currentAd.link_url ? '_blank' : '_self'"
       [class.pointer-events-none]="!currentAd.link_url"
       class="block rounded-2xl overflow-hidden shadow-2xl border-4 border-white/20 hover:scale-[1.02] transition-transform duration-300">
      
      <img [src]="currentAd.image_url" 
           [alt]="'Publicité ' + currentAd.partner_name"
           class="w-full h-auto max-h-[80vh] object-contain bg-white">
    </a>

    <div class="absolute bottom-4 right-4 bg-white/95 backdrop-blur px-4 py-2 rounded-full text-xs font-bold text-gray-600 shadow-lg flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
      Publicité {{ currentAd.partner_name }}
    </div>
  </div>
</div>
