<div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-200">
    
    <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-2xl">📁</span>
        <div>
          <h3 class="font-bold text-gray-800 text-lg">Déplacer la carte</h3>
          <p class="text-xs text-gray-500">{{ card.titre }}</p>
        </div>
      </div>
      <button (click)="cancel.emit()" 
              class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 transition-colors">
        ✕
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-3">
          Choisir la catégorie de destination
        </label>
        
        <div class="space-y-2 max-h-64 overflow-y-auto">
          <label *ngFor="let cat of categories" 
                 class="flex items-center gap-3 p-3 rounded-lg border-2 cursor-pointer transition-all hover:bg-gray-50"
                 [ngClass]="{
                   'border-green-500 bg-green-50': selectedCategoryId === cat.id,
                   'border-gray-200': selectedCategoryId !== cat.id,
                   'opacity-50': cat.id === currentCategoryId
                 }">
            <input type="radio"
                   name="category"
                   [value]="cat.id"
                   [(ngModel)]="selectedCategoryId"
                   class="w-4 h-4 text-green-700">
            <span class="text-xl">📂</span>
            <span class="flex-1 font-medium text-gray-700">{{ cat.nom }}</span>
            <span *ngIf="cat.id === currentCategoryId" 
                  class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded-full">
              Actuelle
            </span>
          </label>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t">
        <button type="button" 
                (click)="cancel.emit()" 
                class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium transition-colors">
          Annuler
        </button>
        <button type="submit" 
                [disabled]="!selectedCategoryId || selectedCategoryId === currentCategoryId"
                class="px-6 py-2 bg-green-700 text-white rounded-lg hover:bg-green-800 font-bold disabled:opacity-50 disabled:cursor-not-allowed transition-colors flex items-center gap-2">
          <span>📁</span>
          <span>Déplacer</span>
        </button>
      </div>

    </form>

  </div>
</div>
