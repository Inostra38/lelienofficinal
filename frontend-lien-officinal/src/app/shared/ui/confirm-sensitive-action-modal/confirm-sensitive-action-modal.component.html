<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm">

    <!-- En-tête -->
    <div class="px-6 py-4 border-b border-gray-200">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-orange-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-bold text-gray-900">Action sécurisée</h3>
          <p class="text-xs text-gray-500 mt-0.5">{{ actionLabel }}</p>
        </div>
      </div>
    </div>

    <!-- Corps -->
    <div class="px-6 py-5 space-y-4">
      <p class="text-sm text-gray-600">
        <span *ngIf="confirmationType === 'pin'">Saisissez <strong>{{ hint || 'votre code PIN' }}</strong> pour confirmer.</span>
        <span *ngIf="confirmationType === 'password'">Saisissez votre <strong>mot de passe</strong> pour confirmer.</span>
      </p>

      <!-- Champ PIN -->
      <div *ngIf="confirmationType === 'pin'">
        <input type="password"
               inputmode="numeric"
               maxlength="6"
               [(ngModel)]="value"
               (keyup.enter)="onConfirm()"
               autofocus
               class="w-full px-4 py-3 border border-gray-300 rounded-lg text-center font-mono text-2xl tracking-widest focus:ring-2 focus:ring-orange-400 focus:border-orange-400 outline-none"
               [class.border-red-400]="errorMessage"
               placeholder="• • • •">
      </div>

      <!-- Champ mot de passe -->
      <div *ngIf="confirmationType === 'password'" class="relative">
        <input [type]="inputType"
               [(ngModel)]="value"
               (keyup.enter)="onConfirm()"
               autofocus
               class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-400 focus:border-orange-400 outline-none"
               [class.border-red-400]="errorMessage"
               placeholder="Votre mot de passe">
        <button type="button"
                (click)="showValue = !showValue"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg *ngIf="!showValue" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showValue" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
          </svg>
        </button>
      </div>

      <!-- Message d'erreur -->
      <p *ngIf="errorMessage" class="text-xs text-red-600 font-medium">{{ errorMessage }}</p>
    </div>

    <!-- Actions -->
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
      <button type="button"
              (click)="onCancel()"
              class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900 font-medium transition-colors">
        Annuler
      </button>
      <button type="button"
              (click)="onConfirm()"
              [disabled]="!value.trim()"
              class="px-5 py-2 bg-orange-500 hover:bg-orange-600 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-lg transition-colors">
        Confirmer
      </button>
    </div>

  </div>
</div>
