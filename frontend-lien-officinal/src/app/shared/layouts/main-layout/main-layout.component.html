<div class="flex h-screen overflow-hidden">

  <app-sidebar
    [team]="team"
    [activeCollaborator]="activeSessionCollaborator"
    [unreadMessagesCount]="unreadMessagesCount"
    [unseenTasksCount]="unseenTasksCount"
    [pharmacyName]="pharmacyName"
    (sessionClick)="openSession($event)"
    (logout)="closeCollaboratorSession()">
  </app-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    <router-outlet></router-outlet>
  </div>

</div>

<!-- Toast inactivité -->
<div *ngIf="showInactivityToast"
     class="fixed bottom-6 right-6 z-50 bg-gray-800 text-white text-sm px-4 py-3 rounded-xl shadow-lg flex items-center gap-3">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
  </svg>
  Session verrouillée — inactivité détectée.
</div>

<!-- Modal PIN collaborateur -->
<app-pin-modal
  *ngIf="showPinModal && pendingCollaborator"
  [collaboratorId]="pendingCollaborator.id!"
  [collaboratorName]="pendingCollaborator.first_name + ' ' + pendingCollaborator.last_name"
  [collaboratorRole]="pendingCollaborator.role"
  mode="switch"
  (pinValidated)="onPinValidated()"
  (cancelled)="onPinCancelled()">
</app-pin-modal>
