<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-[320px] overflow-hidden transform transition-all">

    <div class="bg-gray-50 p-6 text-center border-b relative">
      <button (click)="cancel.emit()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
      <h3 class="text-lg font-bold text-gray-800">{{ title }}</h3>

      <div class="flex justify-center gap-4 mt-6 h-4">
        <div *ngFor="let dot of [1,2,3,4]; let i = index"
             class="w-3 h-3 rounded-full transition-all duration-300"
             [ngClass]="{
               'bg-blue-600 scale-125': i < pin.length,
               'bg-gray-200': i >= pin.length,
               'bg-red-500 animate-pulse': error
             }">
        </div>
      </div>
    </div>

    <div class="p-6 bg-white">
      <div class="grid grid-cols-3 gap-y-6 gap-x-4">
        <button *ngFor="let key of keys"
                (click)="onKeyClick(key)"
                [disabled]="key === ''"
                class="h-16 w-16 mx-auto rounded-full flex items-center justify-center text-2xl font-semibold transition-all active:scale-90 select-none shadow-sm border border-gray-100"
                [ngClass]="{
                  'bg-white hover:bg-gray-50 text-gray-800': key !== '' && key !== '⌫',
                  'text-red-500 hover:bg-red-50 border-none shadow-none': key === '⌫',
                  'invisible': key === ''
                }">
          {{ key }}
        </button>
      </div>
    </div>
  </div>
</div>
