name: CI/CD — Le Lien Officinal

on:
  push:
    branches:
      - '**'

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Tests Django
  # ─────────────────────────────────────────────
  test-backend:
    name: Tests Django
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'False'

    defaults:
      run:
        working-directory: backend_lien_officinal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend_lien_officinal/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python manage.py test apps.planning.tests.test_calculator apps.planning.tests.test_models apps.planning.tests.test_paye_analytics apps.planning.tests.test_paye_analytics_octobre apps.planning.tests.test_paye_analytics_feries apps.planning.tests.test_paye_analytics_tns apps.planning.tests.test_paye_analytics_cache apps.planning.tests.test_paye_analytics_edge apps.planning.tests.test_performance apps.planning.tests.test_utils apps.planning.tests.test_views_absences apps.planning.tests.test_views_security apps.planning.tests.test_views_shifts apps.planning.tests.test_views_templates apps.quality.tests.test_nc apps.quality.tests.test_procedures apps.quality.tests.test_notifications apps.core.tests.test_sms apps.core.tests.test_auth apps.team.tests.test_models apps.team.tests.test_views apps.resources.tests.test_models apps.admin_panel.tests.test_auth tests.test_isolation --settings=backend_lien_officinal.settings_test

  # ─────────────────────────────────────────────
  # JOB 2 — Tests Angular + Build production
  # ─────────────────────────────────────────────
  test-and-build-frontend:
    name: Tests & Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-lien-officinal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-lien-officinal/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci --legacy-peer-deps

      - name: Build Angular (production)
        run: npx ng build --configuration production

  # ─────────────────────────────────────────────
  # JOB 3 — Déploiement Scalingo (main uniquement)
  # ─────────────────────────────────────────────
  deploy:
    name: Déploiement Scalingo
    runs-on: ubuntu-latest
    needs: [test-backend, test-and-build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer SSH pour Scalingo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCALINGO_SSH_KEY }}

      - name: Ajouter le remote Scalingo
        run: |
          git remote add scalingo git@ssh.osc-fr1.scalingo.com:${{ secrets.SCALINGO_APP_NAME }}.git

      - name: Pousser vers Scalingo
        run: |
          git push scalingo main --force
