name: CI/CD — Le Lien Officinal

on:
  push:
    branches:
      - '**'

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Tests Django
  # ─────────────────────────────────────────────
  test-backend:
    name: Tests Django
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: 'False'
      FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
      # E1 : settings.py (importé par settings_test) exige ces clés quand
      # DEBUG=False. Valeurs factices suffisantes pour les tests.
      ADMIN_JWT_SECRET: ci-admin-jwt-secret-not-for-production
      ADMIN_TOTP_KEY: ci-admin-totp-key-not-for-production

    defaults:
      run:
        working-directory: backend_lien_officinal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend_lien_officinal/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Dépendances système WeasyPrint (génération PDF billing)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev shared-mime-info fonts-dejavu-core

      - name: Lancer les tests
        run: python manage.py test apps.planning.tests.test_calculator apps.planning.tests.test_models apps.planning.tests.test_paye_analytics apps.planning.tests.test_paye_analytics_octobre apps.planning.tests.test_paye_analytics_feries apps.planning.tests.test_paye_analytics_tns apps.planning.tests.test_paye_analytics_cache apps.planning.tests.test_paye_analytics_edge apps.planning.tests.test_performance apps.planning.tests.test_utils apps.planning.tests.test_views_absences apps.planning.tests.test_views_security apps.planning.tests.test_views_shifts apps.planning.tests.test_views_templates apps.planning.tests.test_audit_planning_20260710 apps.quality.tests.test_nc apps.quality.tests.test_procedures apps.quality.tests.test_notifications apps.quality.tests.test_authz_20260710 apps.quality.tests.test_ws_handshake apps.core.tests.test_sms apps.core.tests.test_auth apps.core.tests.test_cache apps.core.tests.test_hardening_20260710 apps.core.tests.test_ws_sms_handshake apps.core.tests.test_audit_idor_20260709 apps.core.tests.test_audit_majeurs_20260709 apps.core.tests.test_account_deletion apps.core.tests.test_account_delete_api apps.core.tests.test_account_deletion_tasks apps.team.tests.test_models apps.team.tests.test_views apps.team.tests.test_views_security apps.resources.tests.test_models apps.admin_panel.tests.test_auth apps.admin_panel.tests.test_revocation_failclosed apps.billing.tests.test_models apps.billing.tests.test_promo apps.billing.tests.test_pdf apps.billing.tests.test_webhook apps.billing.tests.test_api apps.billing.tests.test_confirm_replay apps.billing.tests.test_tasks apps.billing.tests.test_free_tier tests.test_isolation tests.test_messaging_tasks_20260710 apps.tasks.tests.test_ws_handshake --settings=backend_lien_officinal.settings_test

  # ─────────────────────────────────────────────
  # JOB 2 — Tests Angular + Build production
  # ─────────────────────────────────────────────
  test-and-build-frontend:
    name: Tests & Build Angular
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-lien-officinal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-lien-officinal/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci --legacy-peer-deps

      - name: Build Angular (production)
        run: npx ng build --configuration production

  # ─────────────────────────────────────────────
  # JOB 3 — Déploiement Scalingo (main uniquement)
  # ─────────────────────────────────────────────
  deploy:
    name: Déploiement Scalingo
    runs-on: ubuntu-latest
    needs: [test-and-build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer SSH pour Scalingo
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCALINGO_SSH_KEY }}

      - name: Ajouter Scalingo aux known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

      - name: Pousser vers Scalingo
        run: |
          git remote add scalingo git@ssh.osc-fr1.scalingo.com:${{ secrets.SCALINGO_APP_NAME }}.git
          git push scalingo main --force

      # La phase release du Procfile n'est PAS exécutée par Scalingo sur cette app
      # (vérifié : aucun conteneur release, migrations jamais appliquées → 500
      # UndefinedColumn). On applique donc les migrations explicitement depuis la CI.
      - name: Installer le CLI Scalingo
        run: |
          curl -O https://cli-dl.scalingo.com/release/scalingo_latest_linux_amd64.tar.gz
          tar -xzf scalingo_latest_linux_amd64.tar.gz
          sudo mv scalingo_*_linux_amd64/scalingo /usr/local/bin/
          scalingo --version

      - name: Appliquer les migrations Django sur Scalingo
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
        run: |
          timeout 300 scalingo --region osc-fr1 --app "${{ secrets.SCALINGO_APP_NAME }}" \
            run -- python /app/backend_lien_officinal/manage.py migrate --noinput
